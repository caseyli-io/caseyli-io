name: Update GitHub Profile date

on:
  schedule:
    - cron: '0 0 * * *'   # Runs daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme-date:
    name: Update GitHub Profile README last-updated date
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update date in README
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i -E "s/(Last updated <strong>)[0-9]{4}-[0-9]{2}-[0-9]{2}(<\/strong>)/\1${TODAY}\2/" README.md
    
      - name: Commit changes
        run: |
          git config user.name "Casey Li"
          git config user.email "309008043+caseyli-io@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "chore: update github profile readme last-updated date"
            git push
          fi
          