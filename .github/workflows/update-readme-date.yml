name: Update GitHub Profile date

on:
  schedule:
    - cron: '0 0 * * *'   # Runs daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme-date:
    name: Update GitHub Profile README last-updated date
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # just need the last commit to check its message

      - name: Check if there's new content since the last date update
        id: check
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == "chore: update github profile readme last-updated date" ]]; then
            echo "has_new_content=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_content=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update date in README
        if: steps.check.outputs.has_new_content == 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i -E "s/(Last updated <strong>)[0-9]{4}-[0-9]{2}-[0-9]{2}(<\/strong>)/\1${TODAY}\2/" README.md

      - name: Commit changes
        if: steps.check.outputs.has_new_content == 'true'
        run: |
          git config --global user.name "caseyli-io"
          git config --global user.email "309008043+caseyli-io@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update github profile readme last-updated date"
          git push
